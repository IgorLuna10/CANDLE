<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/candle.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>c a n d l e | Daily Cantonese</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">

    <!-- Apply dark mode BEFORE first paint to prevent white flash -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('candle-theme') === 'dark') {
            document.documentElement.classList.add('dark');
            document.body && document.body.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
